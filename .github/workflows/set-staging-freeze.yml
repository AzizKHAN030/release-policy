name: Set Staging Freeze

on:
  workflow_dispatch:
    inputs:
      state:
        description: Freeze state
        required: true
        type: choice
        options:
          - freeze
          - unfreeze

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  set-and-revalidate:
    runs-on: ubuntu-latest

    steps:
      - name: Set freeze and update PR statuses
        env:
          GH_TOKEN: ${{ github.token }}
          VARIABLES_TOKEN: ${{ secrets.VARIABLES_TOKEN }}
          STATE: ${{ inputs.state }}
        run: |
          set -e

          if [ "$STATE" = "freeze" ]; then
            FREEZE=true
          else
            FREEZE=false
          fi

          echo "Setting RELEASE_FREEZE=$FREEZE"

          GH_TOKEN="$VARIABLES_TOKEN" gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/actions/variables/RELEASE_FREEZE" \
            -f name="RELEASE_FREEZE" \
            -f value="$FREEZE"

          echo "Updating all open PRs targeting staging..."

          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base staging \
            --state open \
            --limit 100 \
            --json number,headRefOid,labels \
            --jq '.[] | @base64' |
          while read -r PR; do

            DATA=$(echo "$PR" | base64 --decode)

            NUMBER=$(echo "$DATA" | jq -r '.number')
            SHA=$(echo "$DATA" | jq -r '.headRefOid')
            LABELS=$(echo "$DATA" | jq -r '.labels[].name')

            STATUS="success"
            DESCRIPTION="Staging is open"

            if [ "$FREEZE" = "true" ]; then
              if echo "$LABELS" | grep -Fxq "revert"; then
                DESCRIPTION="Revert allowed during staging freeze"
              elif echo "$LABELS" | grep -Fxq "release-fix"; then
                DESCRIPTION="Release fix allowed during staging freeze"
              else
                STATUS="failure"
                DESCRIPTION="Staging is frozen for normal PRs"
              fi
            fi

            echo "PR #$NUMBER: $SHA → $STATUS"

            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
              -f state="$STATUS" \
              -f context="release-policy-gate" \
              -f description="$DESCRIPTION"

          done

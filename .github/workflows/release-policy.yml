name: Release Policy

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

jobs:
  release-policy:
    name: release-policy
    runs-on: ubuntu-latest

    steps:
      - name: Check release policy
        env:
          RELEASE_FREEZE: ${{ vars.RELEASE_FREEZE }}
        run: |
          echo "Release freeze: $RELEASE_FREEZE"

          if [ "$RELEASE_FREEZE" != "true" ]; then
            echo "✅ Release freeze is disabled."
            exit 0
          fi

          echo "Release freeze is active."

          LABELS=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")

          echo "PR labels:"
          echo "$LABELS"

          if echo "$LABELS" | grep -Fxq "revert"; then
            echo "✅ Revert PR is allowed during freeze."
            exit 0
          fi

          if echo "$LABELS" | grep -Fxq "release-fix"; then
            echo "✅ Release fix is allowed during freeze."
            exit 0
          fi

          echo "❌ Staging is frozen. Only 'revert' or 'release-fix' PRs are allowed."
          exit 1

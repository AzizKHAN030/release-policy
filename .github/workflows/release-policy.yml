name: Release Policy

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  release-policy:
    runs-on: ubuntu-latest

    steps:
      - name: Evaluate release policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FREEZE: ${{ vars.RELEASE_FREEZE }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          LABELS=$(jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH")

          STATE="success"
          DESCRIPTION="Staging is open"

          if [ "$RELEASE_FREEZE" = "true" ]; then
            if echo "$LABELS" | grep -Fxq "revert"; then
              DESCRIPTION="Revert allowed during staging freeze"
            elif echo "$LABELS" | grep -Fxq "release-fix"; then
              DESCRIPTION="Release fix allowed during staging freeze"
            else
              STATE="failure"
              DESCRIPTION="Staging is frozen for normal PRs"
            fi
          fi

          echo "Setting release-policy-gate=$STATE for $SHA"

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" \
            -f context="release-policy-gate" \
            -f description="$DESCRIPTION"
